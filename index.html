<!DOCTYPE html>

        <rect x="24" y="44" width="5" height="5" fill="#f5a623" />

        <line x1="51" y1="36" x2="51" y2="40" stroke="#0f2540" stroke-width="2" />

    </div>
  </section>

  <section class="contacto" id="contacto">

      <a href="#" id="contacto-whatsapp-btn" class="btn btn-primary btn-lg" target="_blank" rel="noopener"></a>

<footer class="site-footer">
